services:
  postgres:
    # pgvector build of Postgres 16 - the base image does not ship the extension,
    # and the DocumentChunk migration creates it.
    image: pgvector/pgvector:pg16
    container_name: aicompliance_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aicompliance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aicompliance"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [web]
  # ✅ Backend (DEV mode)
  backend:
    image: node:22-alpine
    container_name: aicompliance_backend
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install && npx prisma generate && npx prisma migrate deploy && npm run dev"
    # ports:
    #   - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true  # 
      - WATCHPACK_POLLING=true   # 
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # traefik
    networks: [web]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aicompliance-api.rule=Host(`api.sitesafe.local`)"
      - "traefik.http.routers.aicompliance-api.entrypoints=web"
      - "traefik.http.services.aicompliance-api.loadbalancer.server.port=3000"

  frontend:
    image: node:22-alpine
    container_name: aicompliance_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host"
    # ports:
    #   - "5173:5173"
    restart: unless-stopped
    # traefik
    networks: [web]
    environment:
      - CHOKIDAR_USEPOLLING=true # <--- Forces Vite to poll
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aicompliance-frontend.rule=Host(`sitesafe.local`)"
      - "traefik.http.routers.aicompliance-frontend.entrypoints=web"
      - "traefik.http.services.aicompliance-frontend.loadbalancer.server.port=5173"

volumes:
  postgres_data:

networks:
  web:
    external: true
